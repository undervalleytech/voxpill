# Release Windows avec Whisper CUDA (feature `gpu` par défaut).
# Nécessite un runner self-hosted Windows sur une machine où sont installés :
# Node.js LTS, CUDA (compatible whisper-rs), Git, et les deps build MSVC.
# Rust : une étape setup-rust-toolchain ajoute cargo au PATH (réutilise rustup local ou installe stable si absent).
#
# Enregistrer le PC : GitHub → repo → Settings → Actions → Runners → New self-hosted runner
# Choisir Windows, suivre les commandes (download + config + run.cmd).
# Tant que run.cmd tourne, les jobs "Release" s’exécutent sur cette machine.
#
# Alternative sans runner allumé : déclencher manuellement ce workflow (workflow_dispatch)
# depuis l’onglet Actions une fois le runner en ligne.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write
    runs-on: [self-hosted, Windows]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # Ne pas utiliser dtolnay/rust-toolchain ici : il invoque bash (souvent absent sur runner Windows pur).
      # Cette action fonctionne en PowerShell : utilise %USERPROFILE%\.cargo\bin si présent, sinon installe rustup/stable.
      - name: Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Voxpill v__VERSION__"
          releaseBody: "Windows installer (Whisper CUDA si GPU NVIDIA) + updater (latest.json)."
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
