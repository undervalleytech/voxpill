# Release Windows avec Whisper CUDA (feature `gpu` par défaut).
# Nécessite un runner self-hosted Windows sur une machine où sont installés :
# Node.js LTS, CUDA (compatible whisper-rs), Git, et les deps build MSVC.
# Rust : étape PowerShell uniquement (pas d’action qui appelle bash/WSL — souvent absent sur runner Windows pur).
# CUDA : définir CUDA_PATH sur le runner (Toolkit NVIDIA) — build.rs copie les DLL runtime dans cuda-redist pour le NSIS.
#
# Enregistrer le PC : GitHub → repo → Settings → Actions → Runners → New self-hosted runner
# Choisir Windows, suivre les commandes (download + config + run.cmd).
# Tant que run.cmd tourne, les jobs "Release" s’exécutent sur cette machine.
#
# Alternative sans runner allumé : déclencher manuellement ce workflow (workflow_dispatch)
# depuis l’onglet Actions une fois le runner en ligne.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: write
    runs-on: [self-hosted, Windows]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # Ni dtolnay/rust-toolchain ni actions-rust-lang/setup-rust-toolchain : ils peuvent invoquer bash (WSL/Git).
      - name: Rust stable (PowerShell, sans bash)
        shell: powershell
        run: |
          $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
          $env:Path = "$cargoBin;$env:Path"
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            Write-Host "cargo absent — installation rustup (rustup-init.exe)…"
            $tmp = Join-Path $env:TEMP "rustup-init.exe"
            Invoke-WebRequest -Uri "https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe" -OutFile $tmp -UseBasicParsing
            & $tmp -y --default-toolchain stable
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:Path = "$cargoBin;$env:Path"
          }
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            Write-Error "cargo introuvable après installation. Vérifie %USERPROFILE%\.cargo\bin et relance."
            exit 1
          }
          rustup default stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc -V
          cargo -V

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: src-tauri
          args: --config cuda-bundle.json
          tagName: v__VERSION__
          releaseName: "Voxpill v__VERSION__"
          releaseBody: "Windows installer (Whisper CUDA si GPU NVIDIA) + updater (latest.json)."
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
